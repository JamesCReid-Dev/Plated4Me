include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.hive_adapter.g.dart"
    - "**/*.riverpod.dart"

  language:
    strict-raw-types: true

linter:
  rules:
    # Critical Rules (Never Violate)
    avoid_relative_lib_imports: true
    always_use_package_imports: true
    prefer_relative_imports: false

    # Important Rules
    avoid_print: true
    always_declare_return_types: true
    type_annotate_public_apis: true

    # Good Practices
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    # sort_pub_dependencies: false — SDK deps (flutter, flutter_test) complicate strict alpha sort
    unnecessary_this: true
    prefer_final_fields: true
    use_key_in_widget_constructors: true

    # Intentionally Disabled
    # sort_constructors_first: false — Constructor order flexibility
    # use_build_context_synchronously: false — Allowed with caution in widgets
    # public_member_api_docs: false — Documentation effort deferred
    dangling_library_doc_comments: false

# Additional information about this file can be found at
# https://dart.dev/tools/analysis
